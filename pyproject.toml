[project]
name = "loan-application-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "black>=26.10.0",
    "fastapi>=0.142.2",
    "pre-commit>=4.6.2",
    "psycopg[binary]>=3.3.6",
    "pydantic[email]>=2.13.5",
    "ruff>=0.16.10",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
loan-application-service = "loan_application_service:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-mock>=3.16.0",
    "ruff>=0.16.10",
]
